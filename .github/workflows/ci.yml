name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install dependencies
        # Hardcoded rather than parsed from pyproject.toml: tomllib is
        # stdlib only on Python 3.11+, and this job also runs on 3.10.
        # Keep this in sync with pyproject.toml's [project.dependencies].
        run: |
          python -m pip install --upgrade pip
          pip install "httpx[http2]>=0.27"

      - name: Byte-compile sanity check
        run: python -m compileall -q mcp

      - name: Run test suite
        run: python -m unittest discover -s tests -v
