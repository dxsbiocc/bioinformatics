[project]
name = "bioinformatics-mcp"
version = "0.1.0"
description = "MCP servers and skills for public bioinformatics databases"
requires-python = ">=3.10"
dependencies = [
    "httpx[http2]>=0.27",
]

# Every MCP server under mcp/ implements the MCP stdio protocol by hand using
# only the Python standard library (json, xml, etc.) for everything except
# outbound HTTP, which goes through httpx (one reused httpx.Client per
# server process) for connection reuse, timeout control, and HTTP/2. There
# is no MCP SDK dependency. This file exists so the dependency set is
# explicit and versioned, and so tooling (uv, pip, IDEs) can discover the
# supported Python version.
#
# Tests run with the standard library's unittest, not pytest:
#   python3 -m unittest discover -s tests

[project.optional-dependencies]
dev = ["ruff>=0.6"]

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "F",   # pyflakes (unused imports/names, undefined names)
    "I",   # isort (import sorting)
    "UP",  # pyupgrade (modernize syntax for the target Python version)
]
ignore = [
    # The codebase's existing style favors long single-line imports and
    # JSON-record construction over wrapping; no formatter has ever been run
    # here, and enforcing this now would mean reflowing ~1000 pre-existing
    # lines for no functional benefit. Revisit if `ruff format` is adopted.
    "E501",
]

[tool.ruff.lint.per-file-ignores]
# Every test file inserts tests/ onto sys.path before importing the shared
# frontend_contract_assertions helper, and most exec the server module under
# test from its file path before referencing it - both require imports (or
# import-like statements) after a preceding statement.
"tests/*.py" = ["E402"]
