[project]
name = "bioinformatics-mcp"
version = "0.1.0"
description = "MCP servers and skills for public bioinformatics databases"
requires-python = ">=3.10"
dependencies = [
    "httpx[http2]>=0.27",
]

# Every MCP server under mcp/ implements the MCP stdio protocol by hand using
# only the Python standard library (json, xml, etc.) for everything except
# outbound HTTP, which goes through httpx (one reused httpx.Client per
# server process) for connection reuse, timeout control, and HTTP/2. There
# is no MCP SDK dependency. This file exists so the dependency set is
# explicit and versioned, and so tooling (uv, pip, IDEs) can discover the
# supported Python version.
#
# Tests run with the standard library's unittest, not pytest:
#   python3 -m unittest discover -s tests

[project.optional-dependencies]
# No optional dependencies today. Kept as an explicit empty group so future
# dev-only tooling (linters, coverage) has a documented place to go instead
# of being installed ad hoc.
dev = []
